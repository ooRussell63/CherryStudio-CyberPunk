<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mini app background regression</title>
<style>
  /* Minimal host styles matching Cherry Studio's maskless mini app drawer:
   * https://github.com/CherryHQ/cherry-studio/blob/v1.3.9/src/renderer/src/components/MinApp/MinappPopupContainer.tsx
   * This fixture tests the CSS cascade, not Electron webview behavior.
   */
  body { font: 16px sans-serif; margin: 24px; }
  body[theme-mode=dark] { --color-background: var(--color-black); color: white; background: #181818; }
  body[theme-mode=light] { --color-background: var(--color-white); color: #181818; background: white; }
  #scene { position: relative; height: 240px; background: #ff0080; }
  #behind { font-size: 32px; }
  .minapp-drawer { position: absolute; inset: 0; }
  .ant-drawer-content { height: 100%; background: var(--color-background); }
  .ant-drawer-header { padding: 20px; }
  .ant-drawer-body { height: 120px; padding: 20px; }
  #other-drawer { background-color: rgb(12, 34, 56); }
  pre { white-space: pre-wrap; }
</style>
<link rel="stylesheet" href="../cyberpunk-theme.css">
<body theme-mode="dark" os="mac">
<h1>Mini app background regression</h1>
<p>Open this file in a browser. All checks should pass; the pink chat behind the drawer must stay hidden.</p>
<div id="scene">
  <div id="behind">CHAT TEXT BEHIND THE MINI APP</div>
  <div class="minapp-drawer">
    <div class="ant-drawer-content" style="background-color: var(--color-background)">
      <div class="ant-drawer-header">Mini app title / controls</div>
      <div class="ant-drawer-body">Loading mini app…</div>
    </div>
  </div>
</div>
<div class="ant-drawer-content" id="other-drawer">Unrelated drawer</div>
<div id="content-container">Main content keeps its translucent gradient</div>
<pre id="results">Running…</pre>
<script>
  window.addEventListener('load', () => {
    const results = [];
    const check = (condition, message) => results.push({ pass: !!condition, message });
    const content = document.querySelector('.minapp-drawer .ant-drawer-content');
    const body = document.querySelector('.ant-drawer-body');
    // Cover both host inline background forms, light/dark, and all host OS values.
    for (const mode of ['light', 'dark']) {
      for (const os of ['mac', 'windows', 'linux']) {
        for (const inline of ['background-color', 'background']) {
          document.body.setAttribute('theme-mode', mode);
          document.body.setAttribute('os', os);
          content.setAttribute('style', `${inline}: var(--color-background)`);
          const label = `${mode}/${os}/${inline}`;
          const expected = mode === 'light' ? 'rgb(255, 255, 255)' : 'rgb(27, 27, 31)';
          check(getComputedStyle(content).backgroundColor === expected, `${label}: opaque title/loading surface`);
          check(getComputedStyle(body).backgroundColor === expected, `${label}: opaque body base`);
          check(getComputedStyle(body).backgroundImage.includes('linear-gradient'), `${label}: neon gradient retained`);
          check(getComputedStyle(document.querySelector('#other-drawer')).backgroundColor === 'rgb(12, 34, 56)', `${label}: unrelated drawer unchanged`);
          check(getComputedStyle(document.querySelector('#content-container')).backgroundColor === 'rgba(0, 0, 0, 0)', `${label}: main content remains translucent`);
        }
      }
    }
    document.body.setAttribute('theme-mode', 'dark');
    document.body.setAttribute('os', 'mac');
    const failures = results.filter(result => !result.pass);
    window.testResults = { total: results.length, failures };
    document.querySelector('#results').textContent = `${results.length - failures.length}/${results.length} passed\n` + failures.map(result => `FAIL: ${result.message}`).join('\n');
    document.title = failures.length ? 'FAIL: mini app background' : 'PASS: mini app background';
  });
</script>
</body>
</html>
